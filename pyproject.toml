[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-tracker"
version = "0.9.0"
description = "Extensible classic Tetris training tracker"
requires-python = ">=3.7"
dependencies = [
	"importlib-metadata; python_version < \"3.8\"",
]

[project.scripts]
tetris-tracker = "tetris_tracker.cli:main"
tetris-tracker-web = "tetris_tracker.web:main"

[project.entry-points."tetris_tracker.collectors"]
nes-retroarch = "tetris_tracker.collectors.nes_retroarch:NesRetroArchCollector"

[tool.setuptools.packages.find]
where = ["src"]
