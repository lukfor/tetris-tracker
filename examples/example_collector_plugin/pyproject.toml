[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "example-tetris-collector"
version = "0.1.0"
requires-python = ">=3.7"
dependencies = ["tetris-tracker"]

[project.entry-points."tetris_tracker.collectors"]
example = "example_tetris_collector.collector:ExampleCollector"

[tool.setuptools.packages.find]
where = ["src"]
